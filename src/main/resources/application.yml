spring:
  h2:
    console:
      enabled: false
  application:
    name: taskboard
  profiles:
    active: prod
  jpa:
    open-in-view: false
  web:
    error:
      include-stacktrace: never
      include-message: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid

# ログの細かさは application-dev.yml に置いている。
# ここに書くと prod でも DEBUG が出るため

ai:
  mock: false
  model: gemini-3.6-flash
  api-key: ${GEMINI_API_KEY:}
  timeout-seconds: 10
  max-attempts: 3

app:
  base-url: http://localhost:8080
  auto-complete-divisor: 1
push:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: mailto:noreply@example.com