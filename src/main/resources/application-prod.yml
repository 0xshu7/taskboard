spring:
  datasource:
    # serverTimezone は、TaskboardApplication の TimeZone.setDefault と同じ値にする。
    # 片方だけ変えると、保存した時刻と読み出した時刻がずれる。
    # ずれても例外は出ないので、完了日時や締切が9時間動いてから気づくことになる
    url: jdbc:mysql://localhost:3306/taskboard?serverTimezone=Asia/Tokyo&characterEncoding=utf8
    username: taskboard
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # validate は、起動のときに「エンティティと表が一致しているか」だけを確かめる。
      # 表も列も作らないし、消しもしない。合っていなければその場で止まる。
      #
      # update から変えたのは、update が黙って足すだけで、
      # 消すことも型を直すこともしないため。
      # 使わなくなった列や、型の違う列が残っていても気づけない。
      #
      # これ以降、表を変えるときは SQL を書いて流す。
      # 起動しなくなったら、エンティティか表のどちらかが先に進んでいる合図になる。
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false