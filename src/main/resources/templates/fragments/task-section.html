<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 部品の定義。同じ見た目を3回書かずに済むようにまとめる            -->
<!-- label＝見出し、list＝タスクの一覧、cls＝色分け用の名前            -->
<!-- このファイル自体は画面として表示せず、他のHTMLから呼ばれるだけ     -->
<section th:fragment="section(label, list, cls)" class="group">

  <h2 class="group-title">
    <span class="tag" th:classappend="'tag-' + ${cls}" th:text="${label}">未実施</span>
    <span class="group-count" th:text="${#lists.size(list)}">0</span>
  </h2>

  <!-- 1件も無いときだけ表示する -->
  <p class="empty" th:if="${#lists.isEmpty(list)}">まだありません</p>

  <ul class="task-list">
    <!-- list の中身を1件ずつ task という名前で取り出す -->
    <li class="task" th:each="task : ${list}" th:classappend="'task-' + ${cls}">

      <!-- --- 1行目：タイトル --- -->
      <p class="task-title" th:text="${task.title}">タスクのタイトル</p>

      <!-- --- 2行目：難易度・締切・操作ボタン --- -->
      <div class="task-meta">

        <!-- 難易度。低/中/高で色を変えるため、クラス名に LOW などを足す -->
        <span class="badge" th:classappend="'badge-' + ${task.difficulty}"
              th:text="'難易度 ' + ${task.difficulty.label}">難易度 中</span>

        <!-- 締切。設定されているときだけ表示する -->
        <span class="due" th:if="${task.dueDate != null}"
              th:text="'〆 ' + ${#temporals.format(task.dueDate, 'M/d')}">〆 9/12</span>

        <span class="spacer"></span>

        <!-- 未実施なら「開始」 -->
        <form th:if="${task.status.name() == 'TODO'}"
              th:action="@{'/tasks/' + ${task.id} + '/status'}" method="post">
          <input type="hidden" name="status" value="DOING">
          <button class="btn-mini" type="submit">開始</button>
        </form>

        <!-- 進行中なら「完了」 -->
        <form th:if="${task.status.name() == 'DOING'}"
              th:action="@{'/tasks/' + ${task.id} + '/status'}" method="post">
          <input type="hidden" name="status" value="DONE">
          <button class="btn-mini btn-done" type="submit">完了</button>
        </form>

        <!-- 完了なら「戻す」 -->
        <form th:if="${task.status.name() == 'DONE'}"
              th:action="@{'/tasks/' + ${task.id} + '/status'}" method="post">
          <input type="hidden" name="status" value="TODO">
          <button class="btn-mini" type="submit">戻す</button>
        </form>

        <!-- 上へ移動 -->
        <form th:action="@{'/tasks/' + ${task.id} + '/move'}" method="post">
          <input type="hidden" name="up" value="true">
          <button class="btn-icon" type="submit" title="上へ">▲</button>
        </form>

        <!-- 下へ移動 -->
        <form th:action="@{'/tasks/' + ${task.id} + '/move'}" method="post">
          <input type="hidden" name="up" value="false">
          <button class="btn-icon" type="submit" title="下へ">▼</button>
        </form>

        <!-- 削除。confirm でキャンセルできるようにする -->
        <form th:action="@{'/tasks/' + ${task.id} + '/delete'}" method="post"
              onclick="return confirm('このタスクを削除しますか？');">
          <button class="btn-icon btn-delete" type="submit" title="削除">✖</button>
        </form>
      </div>

      <!-- --- 編集フォーム --- -->
      <!-- details/summary はHTMLだけで開閉できる。JavaScript が要らない -->
      <details class="edit">
        <summary class="edit-open" title="編集">✒️ 編集</summary>

        <form class="edit-form" th:action="@{'/tasks/' + ${task.id} + '/update'}" method="post">
          <!-- th:value で今の値を初期表示する -->
          <input type="text" name="title" th:value="${task.title}" maxlength="100" required>

          <div class="edit-row">
            <select name="difficulty">
              <!-- 今の難易度が選ばれた状態にする -->
              <option th:each="d : ${difficulties}"
                      th:value="${d}"
                      th:text="${d.label}"
                      th:selected="${d == task.difficulty}">中</option>
            </select>

            <input type="date" name="dueDate" th:value="${task.dueDate}">

            <button class="btn-mini" type="submit">保存</button>
          </div>
        </form>
      </details>

    </li>
  </ul>
</section>

</body>
</html>
