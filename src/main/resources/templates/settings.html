<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定｜さんたく</title>

<!-- CSRF の合言葉。JavaScript が fetch で送るときに、ここから読んでヘッダーに載せる -->
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="icon" th:href="@{/favicon.ico}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/icon-32.png}">
<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
<link rel="manifest" th:href="@{/site.webmanifest}">
</head>

<!--
	data-sound     … 効果音を鳴らすか。effects.js が読む
	data-confetti  … 紙ふぶきを出すか。effects.js が読む
	data-vapid-key … 通知の公開鍵。push.js が読む
-->
<body th:attr="data-sound=${settings.soundEnabled},
               data-confetti=${settings.confettiEnabled},
               data-vapid-key=${vapidKey}">

	<div class="container settings">

		<header class="header">
			<div th:replace="~{fragments/logo :: appTitle}"></div>
		</header>

		<!-- ===== 画面の行き来 =====
		     3つの画面すべてに同じものを置く。
		     いま見ている画面だけ色を変えて、どこにいるか分かるようにする -->
		<nav class="tabs">
			<a class="tab" th:href="@{/tasks}">📝リストへ戻る</a>
		</nav>

		<!-- ===== 通知 ===== -->
		<!--
			「保存する」ボタンは無い。
			スイッチを動かした時点でブラウザに許可を求め、
			届け先の登録と削除をその場で済ませる。

			通知の入切は、種類ごとには分けていない。
			「これは受け取る、これは受け取らない」を選ばせると設定が増え、
			押すたびに判断が1つ増える。
			入れるか入れないかの1つに絞ってある
		-->
		<h2 class="section">プッシュ通知</h2>

		<div class="field">
			<div class="switch-row">
				<span class="switch-label">🔔 通知を受け取る</span>

				<!--
					ラベルでチェックボックスを包むと、どこを押しても切り替わる。
					チェックボックス自体は透明にして隠し、右の span を見た目として使う。
					id は push.js が見ているので、この名前から変えない
				-->
				<label class="switch">
					<input type="checkbox" id="notify-enabled" th:checked="${pushEnabled}">
					<span class="switch-track"></span>
				</label>
			</div>
			<div class="note-row">
			<p class="note">
				毎朝8時のお知らせと、おまかせ完了のお知らせが届きます。
			</p>
			
			<div class="test-notify">
				<button type="button" class="btn-test" id="push-test">通知を試す</button>
			</div>
			</div>
		</div>

		<!-- ===== 演出 ===== -->
		<!--
			どちらも「入れるか入れないか」だけにしてある。

			以前は音量を 0〜100 のつまみで持っていたが、
			効果音は一瞬鳴るだけで、途中の値を選ぶ場面が無かった。
			選べる値を減らすと、設定画面で立ち止まる回数も減る。

			音と紙ふぶきを分けているのは、切りたい理由が別だから。
			静かな場所では音を切りたいし、気が散るなら紙ふぶきを切りたい。
			片方でもう片方を兼ねられない
		-->
		<h2 class="section">演出</h2>

		<div class="field">
			<div class="switch-row">
				<span class="switch-label">🔉 効果音</span>
				<label class="switch">
					<input type="checkbox" id="sound-enabled" th:checked="${settings.soundEnabled}">
					<span class="switch-track"></span>
				</label>
			</div>

			<div class="switch-row">
				<span class="switch-label">🎊 紙ふぶき</span>
				<label class="switch">
					<input type="checkbox" id="confetti-enabled" th:checked="${settings.confettiEnabled}">
					<span class="switch-track"></span>
				</label>
			</div>

			<p class="note">スタートや完了のときの音と、お祝いの紙ふぶきです。</p>
		</div>
		<!-- ===== 最初の3問 ===== -->
		<!--
			消すだけで、質問画面へは送らない。
			次にスタートを押したときに、関所が自動でここへ送る。
			同じ判定を2か所に持たずに済む
		-->
		<h2 class="section">AIタスク提案</h2>

		<div class="field">
			<p class="note">
				主な用途・すすめ方・集中時間。「やりなおす」で次回スタート時に質問からやりなおせます。
			</p>

			<form th:action="@{/profile/reset}" method="post" class="logout-form"
			      onsubmit="return confirm('答えを消して、最初の質問からやり直します。よろしいですか？')">
				<button type="submit" class="btn-logout">やりなおす</button>
			</form>
		</div>
		<div class="field">
			<p class="note">
				このアプリでは、タスク案の作成に Gemini Developer API を使用しています。<br>
				このアプリ内で入力した内容は Google に送信されます。
			</p>
		</div>

		<!-- ===== ログアウト ===== -->
		<!--
			<a> ではなく <form> の POST にしている。
			リンクにすると、他のサイトに <img src=".../logout"> を仕込むだけで
			勝手にログアウトさせられるため
		-->
		<form th:action="@{/logout}" method="post" class="logout-form">
			<button type="submit" class="btn-logout">ログアウト</button>
		</form>

	</div>

	<script th:src="@{/js/push.js}"></script>
	<script>
		// 効果音と紙ふぶきのスイッチ。
		// 切り替えた時点で保存する。「保存する」ボタンは置かない。
		//
		// postJson は push.js が用意している。
		// CSRF の合言葉を付ける処理が入っているので、ここでは呼ぶだけでよい。
		//
		// 2つまとめて送っている。
		// 片方だけ送ると、受け取った側でもう片方が null になり、
		// 既定値に戻ってしまう
		(function () {

			const sound = document.getElementById("sound-enabled");
			const confetti = document.getElementById("confetti-enabled");

			if (sound === null || confetti === null) {
				return;
			}

			function save() {
				postJson("/settings", {
					soundEnabled: sound.checked,
					confettiEnabled: confetti.checked
				});
			}

			sound.addEventListener("change", function () {

				save();

				// 入にしたときだけ鳴らす。効いたことが耳で分かる。
				// 切にしたときに鳴らすと、言っていることと逆になる
				if (sound.checked) {
					const audio = new Audio("/sounds/complete.wav");
					audio.volume = 0.5;
					audio.play();
				}
			});

			confetti.addEventListener("change", save);
		})();
	</script>

</body>
</html>
