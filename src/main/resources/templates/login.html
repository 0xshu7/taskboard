<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>さんたく</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container home">

	<div th:replace="~{fragments/logo :: appTitleLarge}"></div>

	<!-- 名前の由来。初めて見た人に、何をするアプリか1行で伝わる -->
	<p class="app-sub">3つの案から、ひとつ選ぶだけ。</p>

  <!--
    Google の同意画面へ送るURL。
    /oauth2/authorization/{登録名} という形は Spring Security が用意している。
    {登録名} は application.yml の registration の下に書いた名前（google）と同じ。
    画面を移るだけなので、フォームではなくリンクでよい。
  -->
  <a class="btn-google" th:href="@{/oauth2/authorization/google}">Googleではじめる</a>

  <div class="field">
  	<p class="note">
  		このアプリでは、タスク案の作成に Gemini Developer API を使用しています。<br>
  		このアプリ内で入力した内容は Google に送信されます。
  	</p>
  </div>

</div>

</body>
</html>
