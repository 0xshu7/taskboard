<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icon-32.png}">
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
  <link rel="manifest" th:href="@{/site.webmanifest}">
</head>
<body th:attr="data-volume=${volume}">

<div class="container proposals">

  <header class="header">
    <h1 class="proposal-title">きょうはどれからはじめる？</h1>

    <!-- 選んだあと何が起きるかを、押す前に書いておく。
         「選ぶ」だけだと、その先が見えないまま押すことになる -->
    <p class="proposal-lead">選んだタスクがリストに入って、完了のヒントもつくよ</p>
  </header>
  <!-- ===== 3案 ===== -->
  <ul class="card-list">
  
  
  <!-- position（1〜3）をクラス名にして、カードごとに色を変える -->
  <li class="card" th:each="card : ${cards}"
      th:classappend="'card-' + ${card.position}">

	  <div class="card-head">
	    <span class="card-category" th:text="${card.category}">生活</span>

	    <!-- どこから来た案かを出す。
	         sourceTaskId が null なら新しい案、値があればリストにあったもの。
	         表示のためだけの項目は持たず、中の動きと同じ値を見ている -->
	    <span class="card-tag card-tag-new"
	          th:if="${card.sourceTaskId == null}">あたらしい</span>
	    <span class="card-tag card-tag-list"
	          th:unless="${card.sourceTaskId == null}">リストから</span>

	    <span class="badge" th:classappend="'badge-' + ${card.difficulty}"
	          th:text="${card.difficulty.label}">中</span>
	    <span class="card-minutes" th:text="${card.estimatedMinutes} + '分'">5分</span>
	  </div>

    <p class="card-title" th:text="${card.title}">机の上を5分だけ片づける</p>
    <p class="card-reason" th:text="${card.reason}">まず手を動かすと、次に進みやすいので</p>

	<form class="choose-form"
	      th:action="@{'/proposals/' + ${set.id} + '/choose/' + ${card.id}}" method="post">
	  <button type="submit" class="btn-choose">これにする</button>
	</form>

  </li>

   
  </ul>

  <!-- ===== 別の案を見る ===== -->
  <!-- ボタンを止める処理は effects.js が持っている。
       音を鳴らして「AIが考えています…」を出すところまで、あちらで一括して扱う -->
  <form th:action="@{'/proposals/' + ${set.id} + '/retopic'}" method="post" class="retopic-form">
    <button type="submit" class="btn-retopic">別の案を見る</button>
  </form>

</div>
<script th:src="@{/js/effects.js}"></script>
</body>
</html>
