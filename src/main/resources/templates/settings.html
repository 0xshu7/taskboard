<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定｜Task Board</title>

<!-- CSRF の合言葉。JavaScript が fetch で送るときに、ここから読んでヘッダーに載せる -->
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="icon" th:href="@{/favicon.ico}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/icon-32.png}">
<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
<link rel="manifest" th:href="@{/site.webmanifest}">
</head>

<!--
	data-volume    … 効果音の音量。このページの下の方の script が読む
	data-vapid-key … 通知の公開鍵。push.js が読む
-->
<body th:attr="data-volume=${volume}, data-vapid-key=${vapidKey}">

	<div class="container">

		<header class="header">
			<h1 class="app-title"><a th:href="@{/}">Task Board</a></h1>
		</header>

		<!-- ===== 画面の行き来 =====
		     3つの画面すべてに同じものを置く。
		     いま見ている画面だけ色を変えて、どこにいるか分かるようにする -->
		<nav class="tabs">
			<a class="tab" th:href="@{/tasks}">リストへ戻る</a>
		</nav>

		<!-- ===== 通知 ===== -->
		<!--
			「保存する」ボタンは無い。
			スライドを動かした時点でブラウザに許可を求め、
			届け先の登録と削除をその場で済ませる
		-->
		<h2 class="section">通知</h2>

		<div class="field">
			<div class="switch-row">
				<span class="switch-label">締切が近いタスクを通知する</span>

				<!--
					ラベルでチェックボックスを包むと、どこを押しても切り替わる。
					チェックボックス自体は透明にして隠し、右の span を見た目として使う。
					id は push.js が見ているので、この名前から変えない
				-->
				<label class="switch">
					<input type="checkbox" id="notify-enabled" th:checked="${pushEnabled}">
					<span class="switch-track"></span>
				</label>
			</div>

			<p class="note">
				毎朝8時に、締切が今日か明日のタスクを知らせます。<br>
				ブラウザの通知を使うので、メールアドレスは要りません。
			</p>

			<div class="test-notify">
				<button type="button" class="btn-test" id="push-test">通知を試す</button>
			</div>
		</div>

		<!-- ===== 音 ===== -->
		<h2 class="section">音</h2>

		<div class="field">
			<label for="volume-range">効果音の音量</label>
			<div class="volume-row">
				<!-- form の中ではないので th:field は使えない。
				     いまの値は th:value で入れ、保存は下の script が裏で行う -->
				<input type="range" id="volume-range" min="0" max="100" step="10"
					th:value="${volume}">
				<span id="volume-value" th:text="${volume}">50</span>
			</div>
			<p class="note">0 にすると鳴りません。動かすと今の音量で試せます。</p>
		</div>

		<!-- ===== ログアウト ===== -->
		<!--
			<a> ではなく <form> の POST にしている。
			リンクにすると、他のサイトに <img src=".../logout"> を仕込むだけで
			勝手にログアウトさせられるため
		-->
		<form th:action="@{/logout}" method="post" class="logout-form">
			<button type="submit" class="btn-logout">ログアウト</button>
		</form>

	</div>

	<script th:src="@{/js/push.js}"></script>
	<script>
		// 音量のつまみ。
		// 動かしている間は数字を更新し、離したときに鳴らして、その値を保存する。
		//
		// postJson は push.js が用意している。
		// CSRF の合言葉を付ける処理が入っているので、ここでは呼ぶだけでよい
		(function () {
			const range = document.getElementById("volume-range");
			const label = document.getElementById("volume-value");

			if (range === null) {
				return;
			}

			// input は動かしている最中、change は離したとき
			range.addEventListener("input", function () {
				label.textContent = range.value;
			});

			range.addEventListener("change", function () {

				// 保存する。画面は切り替わらない
				postJson("/settings/volume", { soundVolume: Number(range.value) });

				// その音量で鳴らしてみる。効いたことが耳で分かる
				const volume = Number(range.value) / 100;
				if (volume <= 0) {
					return;
				}
				const sound = new Audio("/sounds/complete.wav");
				sound.volume = volume;
				sound.play();
			});
		})();
	</script>

</body>
</html>
