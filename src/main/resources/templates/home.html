<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icon-32.png}">
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
  <link rel="manifest" th:href="@{/site.webmanifest}">
</head>
<body>

<div class="container home">

  <header class="header">
    <h1 class="app-title">Task Board</h1>
    <p class="tagline">迷っているより、まず実行。ほんの少しでも。</p>
  </header>

  <!-- ===== スタート ===== -->
  <!-- 押した瞬間にボタンの表示を変える。二重送信も防げる -->
  <form th:action="@{/proposals}" method="post" class="start-form"
        onsubmit="this.querySelector('button').disabled = true;
                  this.querySelector('button').textContent = '考えています…';">
    <button type="submit" class="btn-start">スタート</button>
  </form>

  <!-- ===== 下のリンク ===== -->
  <!-- 主役はスタートボタンなので、控えめに置く -->
  <p class="to-tasks">
    <a th:href="@{/tasks}">
      タスク一覧
      <span class="to-tasks-count" th:text="${remaining}">0</span>
    </a>
  </p>

</div>

</body>
</html>
