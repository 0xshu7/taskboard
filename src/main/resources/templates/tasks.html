<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

	
	<!-- スタート画面へ戻る -->
	<p class="to-home"><a th:href="@{/}">← スタート</a></p>	
	
	
	
	
  <!-- ===== 見出しと残りタスク数 ===== -->
  <header class="header">
    <h1 class="app-title">Task Board</h1>
    <p class="remaining">
      残り <span class="remaining-num" id="remaining-num" th:text="${remaining}">0</span> 件
    </p>
  </header>

  <!-- ===== 操作の結果メッセージ ===== -->
  <div id="message-area">
    <p class="message" th:if="${message}" th:text="${message}">削除しました</p>
  </div>

  <!-- ===== 新しいタスクを追加するフォーム ===== -->
  <form class="add-form" th:action="@{/tasks}" method="post">

    <div class="add-form-row">

      <input class="input-title" type="text" name="title"
             placeholder="やることを書く" maxlength="100" required autocomplete="off">

      <select class="input-difficulty" name="difficulty">
        <!-- 最初に見えている案内用の項目。value を空にしておく -->
        <option value="" selected disabled hidden>難易度</option>

        <option th:each="d : ${difficulties}"
                th:value="${d}"
                th:text="${d.label}">中</option>
      </select>

      <!-- 最初は文字入力にして「締切」と表示する -->
      <input class="input-due" type="text" name="dueDate" placeholder="締切"
             onfocus="this.type='date'; this.showPicker && this.showPicker();"
             onblur="if (!this.value) { this.type='text'; }">
    </div>

    <button class="btn-add" type="submit">追加する</button>
  </form>

  <!-- ===== 並べ替えの結果を送るための、見えないフォーム ===== -->
  <form id="reorder-form" th:action="@{/tasks/reorder}" method="post">
    <input type="hidden" name="ids" id="reorder-ids">
  </form>

  <!-- ===== 未完了のタスク ===== -->
  <p class="empty" th:if="${#lists.isEmpty(tasks)}">まだタスクがありません</p>

  <ul class="task-list" id="task-list">

    <li class="task" th:each="task : ${tasks}"
        th:data-id="${task.id}"
        th:classappend="'task-' + ${task.status}">

      <span class="drag-handle" title="ドラッグで並べ替え">⠿</span>

      <form th:action="@{'/tasks/' + ${task.id} + '/next'}" method="post" class="status-form">
        <button type="submit" class="tag" th:classappend="'tag-' + ${task.status}">
          <span th:switch="${task.status.name()}">
            <span th:case="'TODO'">未実施</span>
            <span th:case="'DOING'">進行中</span>
          </span>
        </button>
      </form>

      <p class="task-title" th:text="${task.title}">タスクのタイトル</p>

      <!-- 締切。今日より前なら「超過」として色を変える -->
      <span class="due"
            th:classappend="${task.dueDate != null and task.dueDate.isBefore(today) ? 'due-over' : ''}"
            th:text="${task.dueDate == null ? ''
                      : (task.dueDate.isBefore(today)
                         ? '超過 ' + #temporals.format(task.dueDate, 'M/d')
                         : '〆 '   + #temporals.format(task.dueDate, 'M/d'))}">〆 9/12</span>

      <span class="badge"
            th:classappend="'badge-' + ${task.difficulty != null ? task.difficulty : 'MID'}"
            th:text="${task.difficulty != null ? task.difficulty.label : '中'}">中</span>

      <details class="edit">
        <summary class="btn-icon" title="編集">✒️</summary>

        <form class="edit-form" th:action="@{'/tasks/' + ${task.id} + '/update'}" method="post">
          <p class="edit-title">タスクを編集</p>
          <input type="text" name="title" th:value="${task.title}" maxlength="100" required>

          <div class="edit-row">
            <select name="difficulty">
              <option th:each="d : ${difficulties}"
                      th:value="${d}" th:text="${d.label}"
                      th:selected="${d == task.difficulty}">中</option>
            </select>
            <input type="date" name="dueDate" th:value="${task.dueDate}">
            <button type="button" class="btn-cancel"
                    onclick="this.closest('details').open = false;">キャンセル</button>
            <button class="btn-mini" type="submit">保存</button>
          </div>
        </form>
      </details>

      <form class="delete-form" th:action="@{'/tasks/' + ${task.id} + '/delete'}" method="post">
        <button class="btn-icon btn-delete" type="submit" title="削除">✖</button>
      </form>

    </li>
  </ul>

  <!-- ===== 完了したタスク（折りたたみ） ===== -->
  <details class="done-box" th:if="${not #lists.isEmpty(doneTasks)}">

    <summary class="done-summary">
      完了したタスク
      <span class="done-count" th:text="${#lists.size(doneTasks)}">0</span>
    </summary>

    <ul class="task-list">
      <li class="task task-DONE" th:each="task : ${doneTasks}">

        <!-- 完了済みは並べ替えないので、つまむ部分は出さない -->
        <form th:action="@{'/tasks/' + ${task.id} + '/next'}" method="post" class="status-form">
          <button type="submit" class="tag tag-DONE">完了</button>
        </form>

        <p class="task-title" th:text="${task.title}">タスクのタイトル</p>

        <span class="badge"
              th:classappend="'badge-' + ${task.difficulty != null ? task.difficulty : 'MID'}"
              th:text="${task.difficulty != null ? task.difficulty.label : '中'}">中</span>

        <form class="delete-form" th:action="@{'/tasks/' + ${task.id} + '/delete'}" method="post">
          <button class="btn-icon btn-delete" type="submit" title="削除">✖</button>
        </form>
      </li>
    </ul>
  </details>

  <!-- 動作確認用。通知を今すぐ送る -->
  <form th:action="@{/notify/test}" method="post" class="test-notify">
    <button type="submit" class="btn-test">通知をテスト送信</button>
  </form>

</div>

<!-- 並べ替えと削除の処理。ページの最後で読み込む（先に読むとHTMLがまだ無い） -->
<script th:src="@{/js/reorder.js}"></script>
<script th:src="@{/js/delete.js}"></script>

</body>
</html>
